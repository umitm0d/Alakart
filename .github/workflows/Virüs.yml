name: VirusTotal APK Tarama

# Ne zaman çalışsın:
# - Her Pazartesi 03:00 UTC'de otomatik (istersen cron'u değiştir)
# - İstersen Actions sekmesinden manuel de tetikleyebilirsin (workflow_dispatch)
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:
    inputs:
      test_limit:
        description: 'Test için sadece ilk N uygulamayı tara (boş bırakırsan tümü taranır)'
        required: false
        default: ''

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300   # 5 saat — çok sayıda APK varsa süreye yer bırakır

    steps:
      - name: Repoyu çek
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install node-fetch@2 form-data

      - name: Önceki tarama sonuçlarını geri yükle (varsa)
        # vt-scan-results.json repoda zaten varsa script onu okuyup
        # daha önce taranmışları atlıyor, gereksiz VT kotası harcamıyor.
        run: |
          if [ ! -f vt-scan-results.json ]; then
            echo "{}" > vt-scan-results.json
          fi

      - name: VirusTotal taramasını çalıştır
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
          APPS_JSON_URL: ${{ secrets.APPS_JSON_URL }}
          TEST_LIMIT: ${{ github.event.inputs.test_limit }}
        run: node vt-scan-apks.js

      - name: Sonuçları commit'le
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add vt-scan-results.json
          if git diff --cached --quiet; then
            echo "Değişiklik yok, commit atlanıyor."
          else
            git commit -m "chore: VirusTotal tarama sonuçları güncellendi ($(date -u +%Y-%m-%d))"
            git push
          fi
