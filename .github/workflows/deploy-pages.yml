name: deneme

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        
  id-token: write      

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Private kaynak reposunu çek
        uses: actions/checkout@v4
        with:
          repository: umitm0d/Alakart-source
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Obfuscate + minify çalıştır
        run: npm run build

      # ---- Teaser video linkini yalnızca build ÇIKTISINA (dist/) enjekte et ----
      # Kaynak repoda (Alakart-source) veya bu workflow'un log'unda link hiçbir
      # zaman düz görünmez; sadece bu adımdan sonra dist/Umitstore.html içinde
      # bulunur ve o da doğrudan Pages'e yüklenir, geri commit ATILMAZ.
      - name: Teaser video linkini enjekte et
        env:
          TEASER_VIDEO_URL: ${{ secrets.TEASER_VIDEO_URL }}
        run: |
          if [ -z "$TEASER_VIDEO_URL" ]; then
            echo "::error::TEASER_VIDEO_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if [ ! -f "dist/Umitstore.html" ]; then
            echo "::error::dist/Umitstore.html bulunamadı, build çıktısı beklenenden farklı olabilir."
            exit 1
          fi
          if ! grep -q "__TEASER_VIDEO_URL__" dist/Umitstore.html; then
            echo "::warning::Placeholder __TEASER_VIDEO_URL__ dist/Umitstore.html içinde bulunamadı, kontrol edin."
          fi
          python3 - "$TEASER_VIDEO_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "dist/Umitstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__TEASER_VIDEO_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ Teaser video linki dist/Umitstore.html içine enjekte edildi (yalnızca deploy çıktısında)."

      - name: Pages artifact'ini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e deploy et
        id: deployment
        uses: actions/deploy-pages@v4
