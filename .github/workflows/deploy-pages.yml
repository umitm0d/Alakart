name: deneme

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        
  id-token: write      

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Private kaynak reposunu çek
        uses: actions/checkout@v4
        with:
          repository: umitm0d/Alakart-source
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      # ---- Teaser video linkini KAYNAK dosyaya (source/), OBFUSCATE'DEN ÖNCE enjekte et ----
      # ÖNEMLİ: javascript-obfuscator, stringArray: true ayarıyla TÜM string
      # literal'leri (placeholder dahil) base64 kodlu bir diziye taşıyor.
      # Bu yüzden enjeksiyon build SONRASI (dist/) yapılırsa placeholder metni
      # artık bulunamıyor ve video linki hep boş kalıyordu. Çözüm: enjeksiyonu
      # build'den önce, source dosyasında yapmak — obfuscator normal bir string
      # literal'i (gerçek URL) obfuscate eder, bu sorun teşkil etmez.
      #
      # Bu adım checkout edilen working copy'yi değiştirir ama HİÇBİR ZAMAN
      # commit/push edilmez (sadece bu runner'ın geçici diskinde yaşar),
      # dolayısıyla Alakart-source reposunun git history'sine gerçek link
      # yine de sızmaz.
      - name: Teaser video linkini kaynağa enjekte et (build öncesi)
        env:
          TEASER_VIDEO_URL: ${{ secrets.TEASER_VIDEO_URL }}
        run: |
          if [ -z "$TEASER_VIDEO_URL" ]; then
            echo "::error::TEASER_VIDEO_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if [ ! -f "source/Umitm0dstore.html" ]; then
            echo "::error::source/Umitm0dstore.html bulunamadı."
            exit 1
          fi
          if ! grep -q "__TEASER_VIDEO_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __TEASER_VIDEO_URL__ source/Umitm0dstore.html içinde bulunamadı. Kaynak dosya beklenenden farklı olabilir."
            exit 1
          fi
          python3 - "$TEASER_VIDEO_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__TEASER_VIDEO_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ Teaser video linki source/Umitm0dstore.html içine enjekte edildi (build henüz çalışmadı, bu dosya commit edilmeyecek)."

      - name: Obfuscate + minify çalıştır
        run: npm run build

      # ---- KRİTİK: manifest.json ve sw.js dosyaları dist/ içine kopyalanmıyordu ----
      # build-obfuscate.js SADECE Umitm0dstore.html'i işleyip dist/Umitstore.html
      # olarak yazıyor. manifest.json ve sw.js hiçbir adımda dist/ klasörüne
      # kopyalanmadığı için GitHub Pages'te bu iki dosya 404 dönüyordu; bu da
      # service worker kaydının (ve dolayısıyla arka plan bildirim kontrolü,
      # otomatik güncelleme yenilemesi, uygulama ikonu rozeti gibi her şeyin)
      # canlıda hiç çalışmamasına sebep oluyordu.
      - name: Statik dosyaları (manifest.json, sw.js) dist'e kopyala
        run: |
          if [ ! -f "manifest.json" ]; then
            echo "::error::manifest.json repo kökünde bulunamadı."
            exit 1
          fi
          if [ ! -f "source/sw.js" ]; then
            echo "::error::source/sw.js bulunamadı."
            exit 1
          fi
          cp manifest.json dist/manifest.json
          cp source/sw.js dist/sw.js
          echo "✅ manifest.json ve sw.js (source/sw.js'den) dist/ içine kopyalandı"

      - name: Enjeksiyonun build çıktısına geçtiğini doğrula
        run: |
          if grep -q "__TEASER_VIDEO_URL__" dist/Umitstore.html; then
            echo "::error::Placeholder hâlâ dist/Umitstore.html içinde! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          echo "✅ Doğrulandı: dist/Umitstore.html içinde placeholder kalmamış."

      - name: Pages artifact'ini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e deploy et
        id: deployment
        uses: actions/deploy-pages@v4
