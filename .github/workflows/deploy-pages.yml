name: deneme

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        
  id-token: write      

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Private kaynak reposunu çek
        uses: actions/checkout@v4
        with:
          repository: umitm0d/Alakart-source
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      # ---- KRİTİK DÜZELTME ----
      # ${{ github.sha }} / $GITHUB_SHA, workflow'un YAŞADIĞI repo'nun (public Alakart)
      # SHA'sını verir; yukarıda checkout edilen PRIVATE repo'nun (Alakart-source) SHA'sını
      # DEĞİL. Alakart reposuna hiç push yapılmadığı için bu değer build'den build'e HİÇ
      # değişmiyordu — bu yüzden version.json/Firebase her zaman aynı "sürümü" bildiriyor
      # ve client asla güncelleme farkı görmüyordu. Çözüm: checkout SONRASI, artık çalışma
      # dizininde bulunan private repo'nun gerçek HEAD SHA'sını git'ten okuyup onu kullan.
      - name: Gerçek kaynak (private repo) commit SHA'sını yakala
        id: source_sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Kaynak repo commit SHA: $SHA"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      # ---- Teaser video linkini KAYNAK dosyaya (source/), OBFUSCATE'DEN ÖNCE enjekte et ----
      - name: Teaser video linkini kaynağa enjekte et (build öncesi)
        env:
          TEASER_VIDEO_URL: ${{ secrets.TEASER_VIDEO_URL }}
        run: |
          if [ -z "$TEASER_VIDEO_URL" ]; then
            echo "::error::TEASER_VIDEO_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if [ ! -f "source/Umitm0dstore.html" ]; then
            echo "::error::source/Umitm0dstore.html bulunamadı."
            exit 1
          fi
          if ! grep -q "__TEASER_VIDEO_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __TEASER_VIDEO_URL__ source/Umitm0dstore.html içinde bulunamadı. Kaynak dosya beklenenden farklı olabilir."
            exit 1
          fi
          python3 - "$TEASER_VIDEO_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__TEASER_VIDEO_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ Teaser video linki source/Umitm0dstore.html içine enjekte edildi (build henüz çalışmadı, bu dosya commit edilmeyecek)."

      # ---- Cloudinary cloud name / upload preset enjeksiyonu (build öncesi, aynı sebepten: obfuscator öncesi) ----
      - name: Cloudinary bilgilerini kaynağa enjekte et (build öncesi)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          if [ -z "$CLOUDINARY_CLOUD_NAME" ]; then
            echo "::error::CLOUDINARY_CLOUD_NAME secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if [ -z "$CLOUDINARY_UPLOAD_PRESET" ]; then
            echo "::error::CLOUDINARY_UPLOAD_PRESET secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if ! grep -q "__CLOUDINARY_CLOUD_NAME__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __CLOUDINARY_CLOUD_NAME__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          if ! grep -q "__CLOUDINARY_UPLOAD_PRESET__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __CLOUDINARY_UPLOAD_PRESET__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          python3 - "$CLOUDINARY_CLOUD_NAME" "$CLOUDINARY_UPLOAD_PRESET" << 'EOF'
          import sys, io
          cloud_name = sys.argv[1]
          upload_preset = sys.argv[2]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__CLOUDINARY_CLOUD_NAME__", cloud_name)
          html = html.replace("__CLOUDINARY_UPLOAD_PRESET__", upload_preset)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ Cloudinary bilgileri source/Umitm0dstore.html içine enjekte edildi."

      # ---- APPS_JSON_URL enjeksiyonu (build öncesi, aynı sebepten: obfuscator öncesi) ----
      - name: Uygulama listesi JSON linkini kaynağa enjekte et (build öncesi)
        env:
          APPS_JSON_URL: ${{ secrets.APPS_JSON_URL }}
        run: |
          if [ -z "$APPS_JSON_URL" ]; then
            echo "::error::APPS_JSON_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if ! grep -q "__APPS_JSON_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __APPS_JSON_URL__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          python3 - "$APPS_JSON_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__APPS_JSON_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ APPS_JSON_URL source/Umitm0dstore.html içine enjekte edildi."

      # ---- FORUM_PUSH_WORKER_URL enjeksiyonu (build öncesi, aynı sebepten: obfuscator öncesi) ----
      - name: Forum push worker adresini kaynağa enjekte et (build öncesi)
        env:
          FORUM_PUSH_WORKER_URL: ${{ secrets.FORUM_PUSH_WORKER_URL }}
        run: |
          if [ -z "$FORUM_PUSH_WORKER_URL" ]; then
            echo "::error::FORUM_PUSH_WORKER_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if ! grep -q "__FORUM_PUSH_WORKER_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __FORUM_PUSH_WORKER_URL__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          python3 - "$FORUM_PUSH_WORKER_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__FORUM_PUSH_WORKER_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ FORUM_PUSH_WORKER_URL source/Umitm0dstore.html içine enjekte edildi."

      # ---- APP_BUILD_VERSION enjeksiyonu (build öncesi) ----
      # WebView tabanlı uygulama (AppCreator24) sayfayı agresif cache'lediği
      # için, sayfanın kendi içinden periyodik olarak version.json'a bakıp
      # sürüm farkı varsa kendini zorla yenilemesi lazım. Bu adım o kontrolün
      # karşılaştıracağı sürüm değerini (commit SHA) kaynağa gömüyor.
      - name: Uygulama sürümünü kaynağa enjekte et (build öncesi)
        run: |
          if ! grep -q "__APP_BUILD_VERSION__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __APP_BUILD_VERSION__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          sed -i "s/__APP_BUILD_VERSION__/${SOURCE_SHA}/g" source/Umitm0dstore.html
          echo "✅ Uygulama sürümü (${SOURCE_SHA}) source/Umitm0dstore.html içine enjekte edildi."
        env:
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}

      - name: Obfuscate + minify çalıştır
        run: npm run build

      # ---- KRİTİK: manifest.json ve sw.js dosyaları dist/ içine kopyalanmıyordu ----
      - name: Statik dosyaları (manifest.json, sw.js) dist'e kopyala
        run: |
          if [ ! -f "manifest.json" ]; then
            echo "::error::manifest.json repo kökünde bulunamadı."
            exit 1
          fi
          if [ ! -f "source/sw.js" ]; then
            echo "::error::source/sw.js bulunamadı."
            exit 1
          fi
          cp manifest.json dist/manifest.json
          cp source/sw.js dist/sw.js
          echo "✅ manifest.json ve sw.js (source/sw.js'den) dist/ içine kopyalandı"

      # ---- Uygulama listesi JSON'unu dist'e kopyala (repo'da hiçbir yerde görünmez) ----
      # source/umitm0d.json sadece PRIVATE repoda yaşıyor, public repoya asla
      # push edilmiyor. Sadece build sırasında dist/ içine kopyalanıp Pages
      # sitesiyle birlikte yayınlanıyor — aynı origin'den servis edildiği için
      # CORS sorunu da hiç yaşanmıyor.
      - name: Uygulama listesi JSON'unu dist'e kopyala
        run: |
          if [ ! -f "source/umitm0d.json" ]; then
            echo "::error::source/umitm0d.json bulunamadı."
            exit 1
          fi
          cp source/umitm0d.json dist/umitm0d.json
          echo "✅ source/umitm0d.json dist/ içine kopyalandı"

      # ---- version.json üret ----
      # Sayfa içi checkForAppUpdate() bu dosyayı cache: 'no-store' ile
      # okuyup kendi gömülü sürümüyle karşılaştırıyor. Sunucu/CDN sw.js veya
      # ana HTML'i cache'lese bile bu dosya küçük olduğu ve her build'de
      # içeriği değiştiği için güncelliği güvenilir şekilde tespit ediyor.
      - name: version.json oluştur
        run: |
          echo "{\"version\":\"${SOURCE_SHA}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > dist/version.json
          echo "✅ dist/version.json oluşturuldu"
        env:
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}

      - name: Enjeksiyonun build çıktısına geçtiğini doğrula
        run: |
          if grep -q "__TEASER_VIDEO_URL__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (TEASER_VIDEO_URL)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__CLOUDINARY_CLOUD_NAME__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (CLOUDINARY_CLOUD_NAME)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__CLOUDINARY_UPLOAD_PRESET__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (CLOUDINARY_UPLOAD_PRESET)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__APPS_JSON_URL__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (APPS_JSON_URL)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__APP_BUILD_VERSION__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (APP_BUILD_VERSION)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__FORUM_PUSH_WORKER_URL__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (FORUM_PUSH_WORKER_URL)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          echo "✅ Doğrulandı: dist/UmitStoreForum.html içinde placeholder kalmamış."

      - name: Pages artifact'ini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e deploy et
        id: deployment
        uses: actions/deploy-pages@v4

      # ---- Google Cloud kimlik doğrulama (Firebase RTDB REST API için) ----
      # Google, RTDB için eski "database secret" (?auth=SECRET) yöntemini
      # kaldırdı. Artık yetkilendirme bir SERVİS HESABI (service account) JSON
      # anahtarından üretilen OAuth2 access token ile yapılıyor.
      #
      # NOT: Önce google-github-actions/auth@v2 (token_format: access_token)
      # denendi, ama bu action token'ı "self-impersonation" ile üretiyor —
      # yani arka planda IAM Service Account Credentials API'sini çağırıyor.
      # Bu API projede etkin olmadığı için "403 PERMISSION_DENIED" hatası
      # alındı. Bunu (ekstra bir Google Cloud API'sini etkinleştirmeye
      # gerek kalmadan) aşmak için, servis hesabı anahtarından token'ı
      # DOĞRUDAN (google-auth kütüphanesiyle, standart OAuth2 service-account
      # akışıyla) üretiyoruz. Bu akış hiçbir ek API gerektirmez, her servis
      # hesabı anahtarında varsayılan olarak çalışır.
      - name: Firebase servis hesabından access token üret
        id: gcp_auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth
          python3 - << 'EOF'
          import os, json
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '')
          token = ''
          if raw.strip():
              try:
                  info = json.loads(raw)
                  creds = service_account.Credentials.from_service_account_info(
                      info,
                      scopes=[
                          'https://www.googleapis.com/auth/firebase.database',
                          'https://www.googleapis.com/auth/userinfo.email',
                      ],
                  )
                  creds.refresh(Request())
                  token = creds.token or ''
              except Exception as e:
                  print('::warning::Access token üretilemedi: ' + str(e))
          else:
              print('::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret\'ı tanımlı değil.')

          gh_output = os.environ.get('GITHUB_OUTPUT')
          with open(gh_output, 'a') as f:
              f.write('access_token=' + token + '\n')
          EOF

      # ---- Firebase RTDB'ye anlık (push) sürüm bildirimi ----
      # ÖNEMLİ: Bu adım BİLEREK en sona, "GitHub Pages'e deploy et" adımından
      # SONRAYA taşındı. Önceki sürümde bu adım deploy'dan ÖNCE çalışıyordu:
      # Firebase'e "yeni sürüm var" bildirimi site fiilen yayına girmeden önce
      # gidiyordu. Sonuç, gerçek bir örnekte gözlendi: telefondaki debug log'da
      # uygulama Firebase bildirimini alır almaz kendini yeniledi, ama sunucudan
      # hâlâ ESKİ dosya geldiği için sayfa yeniden yüklendikten sonra da "fark
      # var" görmeye devam etti; uygulama arka arkaya 2 kez otomatik yenileme
      # denedi, sonra döngüye girmemek için 20 saniyelik guard devreye girip
      # otomatik yenilemeyi durdurdu ("sayfayı elle yenile" mesajı).
      # Şimdi Firebase bildirimi sadece deploy GERÇEKTEN tamamlandıktan sonra
      # gönderiliyor, böylece client bildirimi aldığı anda sunucudan çektiği
      # sayfa da gerçekten güncel oluyor.
      # Sayfa içindeki listenForAppUpdateRealtime() system/appVersion düğümünü
      # .on('value', ...) ile canlı dinliyor. Burada o düğümü güncelleyince, o an
      # açık olan tüm sekmeler polling beklemeden anında (Firebase'in zaten açık
      # olan bağlantısı üzerinden) haberdar oluyor.
      # Bilinçli olarak job'u BLOKLAMIYOR (exit 1 yok): Firebase erişilemez olsa
      # bile deploy zaten tamamlanmış durumda; client'lar en kötü ihtimalle bir
      # sonraki 15sn'lik version.json polling turunda güncellenir.
      - name: Firebase RTDB'ye sürüm bildir (anlık güncelleme push'u, deploy SONRASI)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
        run: |
          # Ekstra güvenlik payı: deploy-pages@v4 "başarılı" dese bile GitHub'ın
          # global CDN'i her uç noktaya yayılmayı birkaç saniye daha sürdürebilir.
          # Firebase bildirimini bu küçük payı bekleyerek gönderiyoruz.
          echo "CDN'in tam yayılması için 15 sn bekleniyor..."
          sleep 15
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Google Cloud access token alınamadı (FIREBASE_SERVICE_ACCOUNT_JSON secret'ı eksik/geçersiz olabilir), anlık güncelleme push'u atlandı. Eklemek için: Firebase Console > Project Settings > Service accounts > Generate new private key, sonra repo Settings > Secrets and variables > Actions > FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /tmp/firebase_response.json -w "%{http_code}" -X PUT \
            "https://umitstore-4ed52-default-rtdb.europe-west1.firebasedatabase.app/system/appVersion.json" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -d "{\"version\":\"${SOURCE_SHA}\",\"ts\":$(date +%s)000}")
          cat /tmp/firebase_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Firebase RTDB'ye sürüm yazılamadı (HTTP ${HTTP_CODE}). Client'lar en kötü ihtimalle bir sonraki version.json polling turunda güncellenir."
            exit 0
          fi
          echo "✅ Firebase system/appVersion güncellendi (${SOURCE_SHA}) — deploy zaten tamamlandı, site canlı."
