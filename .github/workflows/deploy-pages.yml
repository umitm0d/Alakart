name: build-and-deploy

on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        
  id-token: write      

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Private kaynak reposunu çek
        uses: actions/checkout@v4
        with:
          repository: umitm0d/Alakart-source
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      # ---- KRİTİK DÜZELTME ----
      # ${{ github.sha }} / $GITHUB_SHA, workflow'un YAŞADIĞI repo'nun (public Alakart)
      # SHA'sını verir; yukarıda checkout edilen PRIVATE repo'nun (Alakart-source) SHA'sını
      # DEĞİL. Alakart reposuna hiç push yapılmadığı için bu değer build'den build'e HİÇ
      # değişmiyordu — bu yüzden version.json/Firebase her zaman aynı "sürümü" bildiriyor
      # ve client asla güncelleme farkı görmüyordu. Çözüm: checkout SONRASI, artık çalışma
      # dizininde bulunan private repo'nun gerçek HEAD SHA'sını git'ten okuyup onu kullan.
      - name: Gerçek kaynak (private repo) commit SHA'sını yakala
        id: source_sha
        run: |
          SHA=$(git rev-parse HEAD)
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Kaynak repo commit SHA: $SHA"

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # [perf-fix] cache:'npm' + package-lock.json ikilisi olmadan bu satır
          # etkisiz kalıyordu (cache key genelde lockfile hash'ine bağlanır).
          # Artık repoda bir package-lock.json OLMASI ŞART (bkz. aşağıdaki not).
          cache: 'npm'

      # [perf-fix] ÖNEMLİ: Bu adım "npm install" yerine artık "npm ci" kullanıyor.
      # Eskiden repoda package-lock.json YOKTU — bu yüzden her build'de npm,
      # package.json'daki "^" (caret) aralıklarını (ör. "^4.1.1") registry'den
      # SIFIRDAN yeniden çözümlüyordu: hem cache işe yaramıyordu (cache key
      # lockfile hash'ine bağlanır) hem de bazen gerçekten yeni bir
      # minor/patch sürüm registry'de çıktığında npm onu çekiyordu — "bazen
      # defalarca yenilik güncellemesi yapıyor" şikayetinin sebebi buydu.
      # "npm ci" tam tersine lockfile'daki sürümleri BİREBİR kurar, hiçbir
      # sürüm çözümlemesi yapmaz, üstteki cache ile birlikte çok daha hızlıdır
      # ve deterministiktir (her build'de aynı sürümler).
      #
      # GEREKLİ TEK SEFERLİK ADIM: Bu repo'da henüz package-lock.json yok.
      # "npm ci" lockfile olmadan ÇALIŞMAZ (hata verip durur). Bu yüzden
      # lokalde bir kere:
      #   cd (bu reponun kökü) && npm install
      # çalıştırıp oluşan package-lock.json dosyasını commit'leyin. Ondan
      # sonraki her build bu adımı kullanabilir.
      - name: Bağımlılıkları yükle
        run: npm ci

      # ---- Teaser video linkini KAYNAK dosyaya (source/), OBFUSCATE'DEN ÖNCE enjekte et ----
      - name: Teaser video linkini kaynağa enjekte et (build öncesi)
        env:
          TEASER_VIDEO_URL: ${{ secrets.TEASER_VIDEO_URL }}
        run: |
          if [ -z "$TEASER_VIDEO_URL" ]; then
            echo "::error::TEASER_VIDEO_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if [ ! -f "source/Umitm0dstore.html" ]; then
            echo "::error::source/Umitm0dstore.html bulunamadı."
            exit 1
          fi
          if ! grep -q "__TEASER_VIDEO_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __TEASER_VIDEO_URL__ source/Umitm0dstore.html içinde bulunamadı. Kaynak dosya beklenenden farklı olabilir."
            exit 1
          fi
          python3 - "$TEASER_VIDEO_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__TEASER_VIDEO_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ Teaser video linki source/Umitm0dstore.html içine enjekte edildi (build henüz çalışmadı, bu dosya commit edilmeyecek)."

      # ---- Cloudinary cloud name / upload preset enjeksiyonu (build öncesi, aynı sebepten: obfuscator öncesi) ----
      - name: Cloudinary bilgilerini kaynağa enjekte et (build öncesi)
        env:
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_UPLOAD_PRESET: ${{ secrets.CLOUDINARY_UPLOAD_PRESET }}
        run: |
          if [ -z "$CLOUDINARY_CLOUD_NAME" ]; then
            echo "::error::CLOUDINARY_CLOUD_NAME secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if [ -z "$CLOUDINARY_UPLOAD_PRESET" ]; then
            echo "::error::CLOUDINARY_UPLOAD_PRESET secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if ! grep -q "__CLOUDINARY_CLOUD_NAME__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __CLOUDINARY_CLOUD_NAME__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          if ! grep -q "__CLOUDINARY_UPLOAD_PRESET__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __CLOUDINARY_UPLOAD_PRESET__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          python3 - "$CLOUDINARY_CLOUD_NAME" "$CLOUDINARY_UPLOAD_PRESET" << 'EOF'
          import sys, io
          cloud_name = sys.argv[1]
          upload_preset = sys.argv[2]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__CLOUDINARY_CLOUD_NAME__", cloud_name)
          html = html.replace("__CLOUDINARY_UPLOAD_PRESET__", upload_preset)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ Cloudinary bilgileri source/Umitm0dstore.html içine enjekte edildi."

      # ---- APPS_JSON_URL enjeksiyonu (build öncesi, aynı sebepten: obfuscator öncesi) ----
      - name: Uygulama listesi JSON linkini kaynağa enjekte et (build öncesi)
        env:
          APPS_JSON_URL: ${{ secrets.APPS_JSON_URL }}
        run: |
          if [ -z "$APPS_JSON_URL" ]; then
            echo "::error::APPS_JSON_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if ! grep -q "__APPS_JSON_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __APPS_JSON_URL__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          python3 - "$APPS_JSON_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__APPS_JSON_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ APPS_JSON_URL source/Umitm0dstore.html içine enjekte edildi."

      # ---- FORUM_PUSH_WORKER_URL enjeksiyonu (build öncesi, aynı sebepten: obfuscator öncesi) ----
      - name: Forum push worker adresini kaynağa enjekte et (build öncesi)
        env:
          FORUM_PUSH_WORKER_URL: ${{ secrets.FORUM_PUSH_WORKER_URL }}
        run: |
          if [ -z "$FORUM_PUSH_WORKER_URL" ]; then
            echo "::error::FORUM_PUSH_WORKER_URL secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin."
            exit 1
          fi
          if ! grep -q "__FORUM_PUSH_WORKER_URL__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __FORUM_PUSH_WORKER_URL__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          python3 - "$FORUM_PUSH_WORKER_URL" << 'EOF'
          import sys, io
          url = sys.argv[1]
          path = "source/Umitm0dstore.html"
          with io.open(path, "r", encoding="utf-8") as f:
              html = f.read()
          html = html.replace("__FORUM_PUSH_WORKER_URL__", url)
          with io.open(path, "w", encoding="utf-8") as f:
              f.write(html)
          EOF
          echo "✅ FORUM_PUSH_WORKER_URL source/Umitm0dstore.html içine enjekte edildi."

      # ---- APP_BUILD_VERSION enjeksiyonu (build öncesi) ----
      # WebView tabanlı uygulama (AppCreator24) sayfayı agresif cache'lediği
      # için, sayfanın kendi içinden periyodik olarak version.json'a bakıp
      # sürüm farkı varsa kendini zorla yenilemesi lazım. Bu adım o kontrolün
      # karşılaştıracağı sürüm değerini (commit SHA) kaynağa gömüyor.
      - name: Uygulama sürümünü kaynağa enjekte et (build öncesi)
        run: |
          if ! grep -q "__APP_BUILD_VERSION__" source/Umitm0dstore.html; then
            echo "::error::Placeholder __APP_BUILD_VERSION__ source/Umitm0dstore.html içinde bulunamadı."
            exit 1
          fi
          sed -i "s/__APP_BUILD_VERSION__/${SOURCE_SHA}/g" source/Umitm0dstore.html
          echo "✅ Uygulama sürümü (${SOURCE_SHA}) source/Umitm0dstore.html içine enjekte edildi."
        env:
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}

      - name: Obfuscate + minify çalıştır
        run: npm run build

      # ---- KRİTİK: manifest.json ve sw.js dosyaları dist/ içine kopyalanmıyordu ----
      - name: Statik dosyaları (manifest.json, sw.js) dist'e kopyala
        run: |
          if [ ! -f "manifest.json" ]; then
            echo "::error::manifest.json repo kökünde bulunamadı."
            exit 1
          fi
          if [ ! -f "source/sw.js" ]; then
            echo "::error::source/sw.js bulunamadı."
            exit 1
          fi
          cp manifest.json dist/manifest.json
          cp source/sw.js dist/sw.js
          echo "✅ manifest.json ve sw.js (source/sw.js'den) dist/ içine kopyalandı"

      # ---- YENİ: APK'ları VirusTotal ile otomatik tara (dist'e kopyalamadan ÖNCE) ----
      # SORUN: vt-scan-apks.js daha önce bu pipeline'ın HİÇBİR yerinde çalıştırılmıyordu —
      # yani hiçbir apk hiçbir zaman otomatik taranmıyordu. Ayrıca script kendi içinde
      # "aynı id daha önce taranmışsa atla" mantığı kullanıyordu; bu da bir uygulamanın
      # YENİ SÜRÜMÜ (aynı id, farklı apk) yüklendiğinde eski sonucun kopyalanıp yeni
      # dosyanın hiç taranmadan geçmesine sebep oluyordu (script tarafında ayrıca
      # hash+url karşılaştırmasıyla düzeltildi, bkz. vt-scan-apks.js).
      # Bu adım her deploy'da (yeni mod eklendiğinde veya var olan bir modun
      # url/version'ı değiştiğinde) otomatik çalışır: değişmeyen modlar hash eşleştiği
      # için atlanır (VT kotası boşa harcanmaz), değişenler yeniden taranır.
      #
      # ÖNEMLİ DÜZELTME: Umitm0dstore.html içinde ZATEN HAZIR bekleyen bir mekanizma
      # var (fetchAndMergeVtResults) — sayfa, VT sonuçlarını umitm0d.json'un İÇİNDEN
      # değil, ayrı bir dosyadan (raw.githubusercontent.com/umitm0d/Alakart/refs/heads/
      # main/vt-scan-results.json) çekip her app'e app.vt olarak işliyor ve kartlarda
      # "Riskli/Şüpheli/Temiz" rozetini SADECE bu app.vt alanına bakarak gösteriyor.
      # Önceki sürümde bu adım sonucu umitm0d.json İÇİNE "vtVerdict" adıyla gömüyordu —
      # hem yanlış alan adı (kod app.vt bekliyor, vtVerdict'i hiç okumuyor) hem de
      # yanlış dosya (kod ayrı bir dosyadan okuyor) olduğu için HİÇBİR rozet
      # görünmüyordu. Artık script'in ürettiği vt-scan-results.json dosyası,
      # kodun beklediği TAM olarak o adrese (public Alakart reposunun main dalının
      # KÖKÜNE) otomatik push ediliyor — umitm0d.json'a hiçbir şey yazılmıyor,
      # olduğu gibi bırakılıyor.
      #
      # GÜVENLİK DÜZELTMESİ: vt-scan-results.json artık appUrl/appVersion
      # İÇERMİYOR (bkz. vt-scan-apks.js — writeOutputs). Önceden bu dosya
      # olduğu gibi push edildiğinde her modun gerçek APK indirme linki
      # (mth.tc/..., catbox.moe/..., hatta private GitHub release adresleri)
      # public repoda, raw.githubusercontent.com üzerinden HERKESE açık
      # şekilde görünüyordu. Şimdi sadece rozet göstermek için gereken alanlar
      # (verdict/malicious/suspicious/harmless/undetected/total/scanDate/
      # permalink/hash) push ediliyor.
      # GÜVENLİK DÜZELTMESİ (bkz. vt-scan-apks.js): karşılaştırma/cache kaynağı
      # artık vt-scan-internal-cache.json — appUrl/appVersion içeren TAM
      # kayıtlar (gerçek APK indirme linkleri dahil) sadece bu dosyada tutulur
      # ve hiçbir zaman push edilmez. vt-scan-results.json (public'e push
      # edilen dosya) artık appUrl/appVersion İÇERMEZ, bu yüzden onu cache'lemeye
      # gerek yok — karşılaştırma için gereken bilgi zaten internal cache'te.
      - name: Önceki VT tarama sonuçlarını önbellekten geri yükle
        uses: actions/cache@v4
        with:
          path: vt-scan-internal-cache.json
          key: vt-scan-internal-cache-v1

      - name: APK'ları VirusTotal ile tara (id+hash bazlı, sadece yeni/değişen dosyalar)
        env:
          # YEDEK ANAHTAR DESTEĞİ: VT_API_KEY secret'ına birden fazla anahtar,
          # virgülle ayrılmış olarak girilebilir, ör: "anahtar1,anahtar2,anahtar3".
          # İlk anahtar kota/rate-limit hatası (429) verirse script otomatik olarak
          # sıradaki anahtara geçer; TÜM anahtarlar tükenirse build hataya düşmez,
          # taranamayan modlar bir sonraki build'de (kota yenilendiğinde) otomatik
          # yeniden denenir. Tek anahtar kullanmak istiyorsan hiçbir şey değişmez,
          # sadece virgül koymadan tek anahtarı gir.
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if [ -z "$VT_API_KEY" ]; then
            echo "::error::VT_API_KEY secret'ı tanımlı değil. Repo Settings > Secrets and variables > Actions kısmından ekleyin (virustotal.com üzerinden ücretsiz API anahtarı alınabilir). Birden fazla (yedek) anahtar eklemek için değerleri virgülle ayırarak girin: anahtar1,anahtar2"
            exit 1
          fi
          APPS_JSON_FILE=source/umitm0d.json VT_INTERNAL_CACHE_FILE=vt-scan-internal-cache.json node vt-scan-apks.js
          echo "✅ VirusTotal taraması tamamlandı, sonuçlar vt-scan-results.json içine yazıldı (appUrl/appVersion hariç, sadece internal cache'te)."

      # ---- YENİ: vt-scan-results.json dosyasını public (Alakart) reposunun köküne push et ----
      # Umitm0dstore.html sayfası bu dosyayı TAM OLARAK bu adresten (public repo, main
      # dalı, kök dizin) çekiyor: raw.githubusercontent.com/umitm0d/Alakart/refs/heads/
      # main/vt-scan-results.json — bu adım olmadan dosya hiçbir yere ulaşmıyordu ve
      # rozetler hiç görünmüyordu. actions/checkout burada AYRI bir dizine (alakart-public/)
      # açılıyor çünkü ana checkout adımı zaten private (Alakart-source) reposunu
      # çalışma dizinine çekmiş durumda — ikisini karıştırmamak için.
      # NOT: DISPATCH_TOKEN'ın (main.yml'deki deploy tetikleme için zaten var olan token)
      # Alakart reposu üzerinde "Contents: Read and write" iznine de sahip olması gerekir
      # (sadece "Actions: Read and write" yeterli değildir) — aksi halde push adımı
      # "403"/"denied" hatasıyla başarısız olur (job'u bloklamaz, sadece uyarı basar).
      - name: vt-scan-results.json'u public repoya (Alakart, main) push et
        run: |
          if [ ! -f "vt-scan-results.json" ]; then
            echo "::warning::vt-scan-results.json bulunamadı (VT taraması hiç çalışmamış olabilir), push atlandı."
            exit 0
          fi
          git clone --depth 1 https://x-access-token:${{ secrets.DISPATCH_TOKEN }}@github.com/umitm0d/Alakart.git alakart-public || {
            echo "::warning::Public repo klonlanamadı (DISPATCH_TOKEN izinlerini kontrol edin), push atlandı.";
            exit 0;
          }
          cp vt-scan-results.json alakart-public/vt-scan-results.json
          cd alakart-public
          git config user.name "umitm0d-bot"
          git config user.email "actions@users.noreply.github.com"
          if git diff --quiet -- vt-scan-results.json; then
            echo "ℹ️ vt-scan-results.json değişmemiş, push atlandı."
          else
            git add vt-scan-results.json
            git commit -m "VT tarama sonuçlarını güncelle (otomatik)"
            git push origin HEAD:main || echo "::warning::vt-scan-results.json push edilemedi (DISPATCH_TOKEN izinlerini kontrol edin)."
            echo "✅ vt-scan-results.json public repoya push edildi."
          fi

      # ---- Uygulama listesi JSON'unu dist'e kopyala (repo'da hiçbir yerde görünmez) ----
      # source/umitm0d.json sadece PRIVATE repoda yaşıyor, public repoya asla
      # push edilmiyor. Sadece build sırasında dist/ içine kopyalanıp Pages
      # sitesiyle birlikte yayınlanıyor — aynı origin'den servis edildiği için
      # CORS sorunu da hiç yaşanmıyor. VT sonuçları bu dosyanın İÇİNE değil,
      # ayrı bir dosyaya (vt-scan-results.json, public repoya push edilir) yazılıyor.
      - name: Uygulama listesi JSON'unu dist'e kopyala
        run: |
          if [ ! -f "source/umitm0d.json" ]; then
            echo "::error::source/umitm0d.json bulunamadı."
            exit 1
          fi
          cp source/umitm0d.json dist/umitm0d.json
          echo "✅ source/umitm0d.json (vtVerdict dahil) dist/ içine kopyalandı"

      # ---- version.json üret ----
      # Sayfa içi checkForAppUpdate() bu dosyayı cache: 'no-store' ile
      # okuyup kendi gömülü sürümüyle karşılaştırıyor. Sunucu/CDN sw.js veya
      # ana HTML'i cache'lese bile bu dosya küçük olduğu ve her build'de
      # içeriği değiştiği için güncelliği güvenilir şekilde tespit ediyor.
      - name: version.json oluştur
        run: |
          echo "{\"version\":\"${SOURCE_SHA}\",\"builtAt\":\"$(date -u +%Y-%m-%dT%H:%M:%SZ)\"}" > dist/version.json
          echo "✅ dist/version.json oluşturuldu"
        env:
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}

      - name: Enjeksiyonun build çıktısına geçtiğini doğrula
        run: |
          if grep -q "__TEASER_VIDEO_URL__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (TEASER_VIDEO_URL)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__CLOUDINARY_CLOUD_NAME__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (CLOUDINARY_CLOUD_NAME)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__CLOUDINARY_UPLOAD_PRESET__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (CLOUDINARY_UPLOAD_PRESET)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__APPS_JSON_URL__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (APPS_JSON_URL)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__APP_BUILD_VERSION__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (APP_BUILD_VERSION)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          if grep -q "__FORUM_PUSH_WORKER_URL__" dist/UmitStoreForum.html; then
            echo "::error::Placeholder hâlâ dist/UmitStoreForum.html içinde (FORUM_PUSH_WORKER_URL)! Enjeksiyon başarısız olmuş olabilir."
            exit 1
          fi
          echo "✅ Doğrulandı: dist/UmitStoreForum.html içinde placeholder kalmamış."

      - name: Pages artifact'ini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: GitHub Pages'e deploy et
        id: deployment
        uses: actions/deploy-pages@v4

      # ---- Google Cloud kimlik doğrulama (Firebase RTDB REST API için) ----
      # Google, RTDB için eski "database secret" (?auth=SECRET) yöntemini
      # kaldırdı. Artık yetkilendirme bir SERVİS HESABI (service account) JSON
      # anahtarından üretilen OAuth2 access token ile yapılıyor.
      #
      # NOT: Önce google-github-actions/auth@v2 (token_format: access_token)
      # denendi, ama bu action token'ı "self-impersonation" ile üretiyor —
      # yani arka planda IAM Service Account Credentials API'sini çağırıyor.
      # Bu API projede etkin olmadığı için "403 PERMISSION_DENIED" hatası
      # alındı. Bunu (ekstra bir Google Cloud API'sini etkinleştirmeye
      # gerek kalmadan) aşmak için, servis hesabı anahtarından token'ı
      # DOĞRUDAN (google-auth kütüphanesiyle, standart OAuth2 service-account
      # akışıyla) üretiyoruz. Bu akış hiçbir ek API gerektirmez, her servis
      # hesabı anahtarında varsayılan olarak çalışır.
      - name: Firebase servis hesabından access token üret
        id: gcp_auth
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: |
          pip install --quiet google-auth
          python3 - << 'EOF'
          import os, json
          from google.oauth2 import service_account
          from google.auth.transport.requests import Request

          raw = os.environ.get('FIREBASE_SERVICE_ACCOUNT_JSON', '')
          token = ''
          if raw.strip():
              try:
                  info = json.loads(raw)
                  creds = service_account.Credentials.from_service_account_info(
                      info,
                      scopes=[
                          'https://www.googleapis.com/auth/firebase.database',
                          'https://www.googleapis.com/auth/userinfo.email',
                      ],
                  )
                  creds.refresh(Request())
                  token = creds.token or ''
              except Exception as e:
                  print('::warning::Access token üretilemedi: ' + str(e))
          else:
              print('::warning::FIREBASE_SERVICE_ACCOUNT_JSON secret\'ı tanımlı değil.')

          gh_output = os.environ.get('GITHUB_OUTPUT')
          with open(gh_output, 'a') as f:
              f.write('access_token=' + token + '\n')
          EOF

      # ---- Firebase RTDB'ye anlık (push) sürüm bildirimi ----
      # ÖNEMLİ: Bu adım BİLEREK en sona, "GitHub Pages'e deploy et" adımından
      # SONRAYA taşındı. Önceki sürümde bu adım deploy'dan ÖNCE çalışıyordu:
      # Firebase'e "yeni sürüm var" bildirimi site fiilen yayına girmeden önce
      # gidiyordu. Sonuç, gerçek bir örnekte gözlendi: telefondaki debug log'da
      # uygulama Firebase bildirimini alır almaz kendini yeniledi, ama sunucudan
      # hâlâ ESKİ dosya geldiği için sayfa yeniden yüklendikten sonra da "fark
      # var" görmeye devam etti; uygulama arka arkaya 2 kez otomatik yenileme
      # denedi, sonra döngüye girmemek için 20 saniyelik guard devreye girip
      # otomatik yenilemeyi durdurdu ("sayfayı elle yenile" mesajı).
      # Şimdi Firebase bildirimi sadece deploy GERÇEKTEN tamamlandıktan sonra
      # gönderiliyor, böylece client bildirimi aldığı anda sunucudan çektiği
      # sayfa da gerçekten güncel oluyor.
      # Sayfa içindeki listenForAppUpdateRealtime() system/appVersion düğümünü
      # .on('value', ...) ile canlı dinliyor. Burada o düğümü güncelleyince, o an
      # açık olan tüm sekmeler polling beklemeden anında (Firebase'in zaten açık
      # olan bağlantısı üzerinden) haberdar oluyor.
      # Bilinçli olarak job'u BLOKLAMIYOR (exit 1 yok): Firebase erişilemez olsa
      # bile deploy zaten tamamlanmış durumda; client'lar en kötü ihtimalle bir
      # sonraki 15sn'lik version.json polling turunda güncellenir.
      - name: Firebase RTDB'ye sürüm bildir (anlık güncelleme push'u, deploy SONRASI)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          SOURCE_SHA: ${{ steps.source_sha.outputs.sha }}
        run: |
          # Ekstra güvenlik payı: deploy-pages@v4 "başarılı" dese bile GitHub'ın
          # global CDN'i her uç noktaya yayılmayı birkaç saniye daha sürdürebilir.
          # Firebase bildirimini bu küçük payı bekleyerek gönderiyoruz.
          echo "CDN'in tam yayılması için 15 sn bekleniyor..."
          sleep 15
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Google Cloud access token alınamadı (FIREBASE_SERVICE_ACCOUNT_JSON secret'ı eksik/geçersiz olabilir), anlık güncelleme push'u atlandı. Eklemek için: Firebase Console > Project Settings > Service accounts > Generate new private key, sonra repo Settings > Secrets and variables > Actions > FIREBASE_SERVICE_ACCOUNT_JSON."
            exit 0
          fi
          HTTP_CODE=$(curl -s -o /tmp/firebase_response.json -w "%{http_code}" -X PUT \
            "https://umitstore-4ed52-default-rtdb.europe-west1.firebasedatabase.app/system/appVersion.json" \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            -d "{\"version\":\"${SOURCE_SHA}\",\"ts\":$(date +%s)000}")
          cat /tmp/firebase_response.json
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::warning::Firebase RTDB'ye sürüm yazılamadı (HTTP ${HTTP_CODE}). Client'lar en kötü ihtimalle bir sonraki version.json polling turunda güncellenir."
            exit 0
          fi
          echo "✅ Firebase system/appVersion güncellendi (${SOURCE_SHA}) — deploy zaten tamamlandı, site canlı."

      # ---- YENİ: Yeni eklenen modlar için gerçek (arka planda da çalışan) push bildirimi ----
      # SORUN: source/umitm0d.json içinde "new": true işaretli bir mod eklendiğinde,
      # PWA'da bildirim SADECE sayfa açıkken ve ikinci bir fetchNotifications() turunda
      # (Notification API ile, yerel/foreground) görünüyordu — çünkü notificationData
      # her sayfa yüklemesinde sıfırdan başlıyor ve app.new karşılaştırması hafızada
      # tutuluyor, Firebase/FCM'e hiç dokunmuyordu. Uygulama kapalıyken veya arka
      # plandayken (yani asıl "bildirim" beklenen durumda) HİÇBİR şey gitmiyordu.
      # ÇÖZÜM: forum/comment/rating'de zaten çalışan gerçek FCM push hattını (Worker +
      # broadcastFeed) burada da kullan. Client tarafında admin panelinden broadcast
      # atıldığında yapılan işin AYNISINI (broadcasts/{key} yaz + Worker'ı feedType=
      # broadcastFeed ile tetikle) deploy sırasında, "new" işaretli her mod için BİR
      # KEZ otomatik yapıyoruz. notifiedNewApps/{appId} düğümü, aynı mod için build'den
      # build'e tekrar tekrar bildirim gitmesini engelliyor (kalıcı "gönderildi" kaydı).
      # Bilinçli olarak job'u BLOKLAMIYOR: Firebase/Worker erişilemezse bildirim o build'de
      # atlanır, bir sonraki build'de (mod hâlâ "new":true ise) tekrar denenir.
      - name: Yeni eklenen modlar için push bildirimi gönder (broadcastFeed üzerinden)
        env:
          ACCESS_TOKEN: ${{ steps.gcp_auth.outputs.access_token }}
          FORUM_PUSH_WORKER_URL: ${{ secrets.FORUM_PUSH_WORKER_URL }}
        run: |
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "::warning::Access token yok, yeni mod bildirimi atlandı."
            exit 0
          fi
          if [ -z "$FORUM_PUSH_WORKER_URL" ]; then
            echo "::warning::FORUM_PUSH_WORKER_URL tanımlı değil, yeni mod bildirimi atlandı."
            exit 0
          fi
          python3 - << 'EOF'
          import os, json, time, urllib.request

          ACCESS_TOKEN = os.environ.get('ACCESS_TOKEN', '')
          WORKER_URL = os.environ.get('FORUM_PUSH_WORKER_URL', '')
          DB_BASE = 'https://umitstore-4ed52-default-rtdb.europe-west1.firebasedatabase.app'

          def rtdb_get(path):
              req = urllib.request.Request(DB_BASE + path + '.json',
                                            headers={'Authorization': 'Bearer ' + ACCESS_TOKEN})
              try:
                  with urllib.request.urlopen(req) as r:
                      data = r.read()
                      return json.loads(data) if data and data != b'null' else None
              except Exception as e:
                  print('RTDB GET hata (' + path + '):', e)
                  return None

          def rtdb_put(path, payload):
              body = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(DB_BASE + path + '.json', data=body, method='PUT',
                                            headers={'Authorization': 'Bearer ' + ACCESS_TOKEN,
                                                     'Content-Type': 'application/json'})
              with urllib.request.urlopen(req) as r:
                  return r.read()

          def rtdb_post(path, payload):
              body = json.dumps(payload).encode('utf-8')
              req = urllib.request.Request(DB_BASE + path + '.json', data=body, method='POST',
                                            headers={'Authorization': 'Bearer ' + ACCESS_TOKEN,
                                                     'Content-Type': 'application/json'})
              with urllib.request.urlopen(req) as r:
                  return json.loads(r.read())

          def as_dict(value):
              # Firebase RTDB, anahtarları ardışık sayısal (0,1,2,...) olan bir
              # düğümü otomatik olarak JSON ARRAY olarak döndürür, dict değil.
              # notifiedNewApps'teki id'ler (1,2,3...) tam bu duruma denk geldiği
              # için already bazen list, bazen dict dönebiliyor. Burada her
              # durumda index/anahtarı STRING id'ye çevirip normal bir dict'e
              # dönüştürüyoruz ki .get(app_id) her zaman güvenle çalışsın.
              if value is None:
                  return {}
              if isinstance(value, dict):
                  return value
              if isinstance(value, list):
                  return {str(i): v for i, v in enumerate(value) if v is not None}
              return {}

          try:
              with open('source/umitm0d.json', 'r', encoding='utf-8') as f:
                  apps = json.load(f)
          except Exception as e:
              print('source/umitm0d.json okunamadı:', e)
              apps = []

          # ARTIK "new" alanına hiç bakmıyoruz — o alan sadece sayfa tarafında
          # ürün kartında "YENİ" rozetinin birkaç gün görünmesi için kullanılıyor,
          # bildirim kararıyla bağımsız. Bildirim kararı sadece şuna bakıyor:
          # - id daha önce hiç görülmemiş (yeni mod eklenmiş), VEYA
          # - id daha önce görülmüş AMA timestamp değişmiş (mod güncellenmiş)
          # Bu sayede admin "new" alanını false'a çekmeyi unutsa/geciktirse bile
          # aynı mod için tekrar tekrar bildirim gitmiyor; sadece gerçekten
          # timestamp'i değişen (yani bilinçli güncellenen) modlar bildirim alıyor.
          candidate_apps = [a for a in apps if a.get('id')]
          if not candidate_apps:
              print('JSON içinde id\'li mod yok, bildirim atlanıyor.')
          else:
              already = as_dict(rtdb_get('/notifiedNewApps'))

              # TEK SEFERLİK GÖÇ KORUMASI: notifiedNewApps'te HİÇ kaydı olmayan
              # (yani bu yeni id+timestamp mantığından önce hiç işlenmemiş) id'ler
              # için, direkt bildirim atmak yerine önce sessizce "görülmüş" olarak
              # kaydediyoruz. Böylece id 1-13 gibi yıllardır JSON'da duran, hiç
              # değişmemiş eski modlar bu güncelleme yüzünden topluca bildirim
              # göndermiyor. Bundan sonra sadece GERÇEKTEN timestamp'i değişen
              # modlar bildirim alacak.
              missing_ids = [str(a['id']) for a in candidate_apps if str(a['id']) not in already]
              if missing_ids:
                  print('ℹ️ İlk kez görülen (kaydı olmayan) id\'ler bildirim atılmadan kaydediliyor: ' + ', '.join(missing_ids))
                  for app in candidate_apps:
                      app_id = str(app['id'])
                      if app_id not in missing_ids:
                          continue
                      app_timestamp = str(app.get('timestamp') or '')
                      try:
                          rtdb_put('/notifiedNewApps/' + app_id, {
                              'timestamp': app_timestamp,
                              'notifiedAt': int(time.time() * 1000),
                              'backfilled': True
                          })
                      except Exception as e:
                          print('notifiedNewApps backfill yazılamadı (' + app_id + '):', e)
                  already = as_dict(rtdb_get('/notifiedNewApps'))

              for app in candidate_apps:
                  app_id = str(app['id'])
                  app_timestamp = str(app.get('timestamp') or '')

                  prev = already.get(app_id)
                  if prev is not None:
                      if isinstance(prev, dict):
                          prev_timestamp = str(prev.get('timestamp') or '')
                      else:
                          # eski format: prev == True, timestamp bilgisi yok.
                          # Bu durumda elimizde karşılaştıracak bir şey yok; bir daha
                          # bildirim atmıyoruz (ilk göç bu şekilde sorunsuz yapılmış olur).
                          prev_timestamp = None

                      if prev_timestamp is None:
                          continue
                      if not app_timestamp or app_timestamp == prev_timestamp:
                          continue
                      print('🔄 Mod güncellenmiş (timestamp değişti), yeniden bildirim gönderiliyor: ' + app_id)
                  else:
                      print('🆕 Daha önce görülmemiş id, bildirim gönderiliyor: ' + app_id)

                  name = app.get('name', 'Yeni Mod')
                  # Worker zaten broadcast bildirimlerinin başına "📢 " ekliyor,
                  # burada tekrar emoji eklemiyoruz (bkz. orjinalworkers-1.js: broadcastFeed).
                  broadcast = {
                      'title': 'Yeni Mod Eklendi',
                      'message': name,
                      'uid': None,
                      'ts': int(time.time() * 1000)
                  }
                  try:
                      res = rtdb_post('/broadcasts', broadcast)
                  except Exception as e:
                      print('broadcasts yazılamadı (' + app_id + '):', e)
                      continue
                  push_key = res.get('name') if isinstance(res, dict) else None
                  if not push_key:
                      print('broadcasts push key alınamadı:', app_id)
                      continue
                  worker_body = json.dumps({'feedType': 'broadcastFeed', 'feedId': push_key}).encode('utf-8')
                  # ÖNEMLİ: Worker (orjinalworkers-1.js) yalnızca Origin header'ı
                  # https://umitm0d.github.io olan istekleri kabul ediyor (satır ~590,
                  # "origin izinli değil" 403). GitHub Actions'tan atılan bir sunucu-sunucu
                  # isteği tarayıcı olmadığı için Origin header'ı normalde HİÇ gitmez — bu
                  # yüzden Origin'i elle, sitenin gerçek adresiyle eşleşecek şekilde set
                  # ediyoruz. Bu bir güvenlik açığı değil: origin kontrolü sadece "bu worker
                  # sadece bizim sitemizden çağrılsın" kuralını uyguluyor, biz zaten kendi
                  # deploy pipeline'ımızdan, kendi sitemiz adına çağırıyoruz.
                  wreq = urllib.request.Request(WORKER_URL, data=worker_body, method='POST',
                                                 headers={'Content-Type': 'application/json',
                                                          'Origin': 'https://umitm0d.github.io',
                                                          'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36',
                                                          'Accept': 'application/json',
                                                          'Referer': 'https://umitm0d.github.io/'})
                  try:
                      with urllib.request.urlopen(wreq) as wr:
                          print('Worker yanıtı (' + app_id + '):', wr.status)
                  except urllib.error.HTTPError as e:
                      body = ''
                      try:
                          body = e.read().decode('utf-8', errors='replace')
                      except Exception:
                          pass
                      print('Worker çağrısı hata (' + app_id + '):', e.code, e.reason)
                      print('Worker hata gövdesi (' + app_id + '):', body)
                      print('Worker hata header\'ları (' + app_id + '):', dict(e.headers) if e.headers else {})
                      continue
                  except Exception as e:
                      print('Worker çağrısı hata (' + app_id + '):', e)
                      continue
                  try:
                      # Artık sadece True değil, id'nin bildirildiği anki timestamp'i de
                      # saklıyoruz ki bir sonraki deploy'da "aynı mod mu, yoksa güncellenmiş
                      # (yeni timestamp'li) bir versiyon mu" ayrımını yapabilelim.
                      rtdb_put('/notifiedNewApps/' + app_id, {
                          'timestamp': app_timestamp,
                          'notifiedAt': int(time.time() * 1000)
                      })
                  except Exception as e:
                      print('notifiedNewApps yazılamadı (' + app_id + '):', e)
                  print('✅ Yeni mod bildirimi gönderildi: ' + name)
          EOF
