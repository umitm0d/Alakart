name: Deploy'u Tetikle

# source/Umitm0dstore.html, source/umitm0d.json veya build script'i değişince
# otomatik çalışır, public repodaki (Alakart) asıl build+deploy workflow'unu
# API üzerinden tetikler.
on:
  push:
    branches: [main]
    paths:
      - 'source/Umitm0dstore.html'
      - 'source/umitm0d.json'
      - 'build-obfuscate.js'
      - 'package.json'
      - 'manifest.json'
      - 'source/sw.js'

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Public repodaki deploy workflow'unu tetikle
        env:
          TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::error::DISPATCH_TOKEN secret'ı tanımlı değil veya boş."
            exit 1
          fi

          http_code=$(curl -sS -o response.txt -w "%{http_code}" -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/umitm0d/Alakart/actions/workflows/deploy-pages.yml/dispatches \
            -d '{"ref":"main"}')

          echo "HTTP durum kodu: $http_code"
          cat response.txt

          # Başarılı dispatch 204 No Content döner. Başka bir kod (401/404/422 vb.)
          # token'ın süresi dolmuş, yanlış scope'ta, workflow dosya adı yanlış,
          # veya workflow'un default branch'te "on: workflow_dispatch" olarak
          # tanımlı olmadığı anlamına gelir. Bu adımı artık SESSİZCE yeşil
          # geçmesin diye burada patlatıyoruz.
          if [ "$http_code" != "204" ]; then
            echo "::error::Dispatch isteği başarısız oldu (HTTP $http_code). DISPATCH_TOKEN izinlerini (repo/workflow scope, veya fine-grained token için 'Actions: write') ve hedef workflow dosya adını kontrol edin."
            exit 1
          fi

          echo "✅ Alakart reposundaki deploy workflow'u tetiklendi"
