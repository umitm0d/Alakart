name: Private Kaynaktan Build ve Pages Deploy


on:
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write        
  id-token: write      

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      
      - name: Private kaynak reposunu çek
        uses: actions/checkout@v4
        with:
          repository: umitm0d/Alakart-source
          token: ${{ secrets.PRIVATE_REPO_PAT }}

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Bağımlılıkları yükle
        run: npm install

      - name: Obfuscate + minify çalıştır
        run: npm run build

      
      - name: Pages artifact'ini hazırla
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      
      - name: GitHub Pages'e deploy et
        id: deployment
        uses: actions/deploy-pages@v4
